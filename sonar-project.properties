# SonarCloud Configuration
sonar.projectKey=diet-case-builder
sonar.organization=your-org # Substituir pela sua organização SonarCloud

# Metadata
sonar.projectName=DietCase Builder
sonar.projectVersion=1.0

# Source configuration
sonar.sources=src
sonar.tests=src/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# Language
sonar.language=ts,tsx,js,jsx

# TypeScript/JavaScript specific
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Code coverage
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/mocks/**,**/test/**

# Duplication
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx

# Security
sonar.security.hotspots.enabled=true
